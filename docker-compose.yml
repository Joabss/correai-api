services:
  api:
    image: correai-api
    networks:
      - infra
    build:
      context: .
      dockerfile: Dockerfile
    container_name: correai
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/correai
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: dev
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  infra:
    external: true
    name: infra-local_default