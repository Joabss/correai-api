services:
  api:
    build: .
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/correai
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"

networks:
  default:
    name: infra-local_default
    external: true